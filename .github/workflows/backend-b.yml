name: Backend integration verification

on:
  push:
    branches: ['feature/**', 'integration/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-ci-only
          MYSQL_DATABASE: backend_b_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --password=ephemeral-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check app src tests scripts
      - run: python -m ruff format --check app src tests scripts
      - run: python -m pytest -q --junitxml=test-results/sqlite.xml --ignore=tests/test_mysql.py
      - name: MySQL migration and HTTP E2E
        env:
          TEST_MYSQL_URL: mysql+pymysql://root:ephemeral-ci-only@127.0.0.1:3306/backend_b_test?charset=utf8mb4
        run: python -m pytest -q tests/test_mysql.py --junitxml=test-results/mysql.xml
