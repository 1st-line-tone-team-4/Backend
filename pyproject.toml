[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "team4-learning-backend"
version = "1.3.0"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["app", "language_learning_api", "language_learning_api.routers", "language_learning_api.services"]

[tool.setuptools.package-dir]
language_learning_api = "src/language_learning_api"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.in"]}
